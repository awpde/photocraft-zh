name: 构建简体中文版 (Windows)

# 从上游源码编译 PhotoCraft 的简体中文版 Windows 安装包（MSI）+ 便携版 zip。
#
# 与姊妹项目 PdfCraft 的方案相比，这个工作流**不处理字体**：
#   PhotoCraft 的界面中文字体是运行时从系统读取的（Windows 上取 C:\Windows\Fonts\msyh.ttc，
#   即微软雅黑），见 crates/text/src/cjk.rs。所以不需要嵌入任何中文字体，
#   既不用换字体也不用校验字体 —— 省掉约 8 MB 体积和 4 个步骤。
#
# 这里唯一对上游交付物的改动是「安装向导文案中文化」：
#   上游 v0.17.0 起自带完整安装向导（WixUI_InstallDir + 作用域选择页），自选安装位置与
#   每用户/全机器作用域都是原生支持，本工作流不再自建界面覆盖 —— 自建覆盖每逢上游改安装界面
#   就会失效（2026-10-29 就是这样挂的）。这里只做**一处极小改动**：把
#   overrides/photocraft.zh-cn.wxl 接上去，让 package.ps1 的 wix build 改成
#   「-culture zh-cn -loc ...photocraft.zh-cn.wxl」，于是向导文案是中文
#   （WiX 5 自带 WixUI_zh-CN.wxl 做底座，我们的文件只补它没有的几条）。
#   注意：wxl 里必须写 Codepage="936"，否则中文进不了 MSI 数据库，会报 WIX0311。
#   改动带锚点存在性与唯一性校验。

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: '上游分支或 tag（默认 main；填旧 tag 可能不含中文词条会被跳过）'
        required: false
        default: 'main'
        type: string
      version_suffix:
        description: '版本后缀，仅用于文件名，避免和官方包混淆'
        required: false
        default: 'zh.1'
        type: string
      make_release:
        description: '构建成功后创建 / 更新 Release'
        required: false
        default: true
        type: boolean
  schedule:
    # 每天自动跟版：UTC 22:00 = 北京时间 06:00
    - cron: '0 22 * * *'

permissions:
  contents: write

env:
  UPSTREAM: storytold/photocraft
  # 界面译文所在的文件。没有它就说明这个版本还是英文界面，直接跳过构建。
  ZH_CATALOG: crates/ui-egui/src/i18n/zh-hans.tsv

  # 与官方发版**完全一致**的字形集合（官方 release.yml 里锁的就是这个 commit）。
  # 里面是日文字体；简体中文/繁体中文不走它，而是运行时读系统字体（Windows 上为微软雅黑）。
  # 不设它也能构建（上游有 ui_works_without_craft_fonts 测试），但那样日文界面会退回系统日文字体，
  # 交付物就和官方不一致了。设上它之后，我们的包与官方的唯一差别就只有安装界面。
  CRAFT_FONTS_REPO: storytold/craft-fonts
  CRAFT_FONTS_REF: abb83316d96aa59c1cf64784289e378fe9fa5695

  # ---- 「自选安装位置」注入参数 ------------------------------------------------------------
  # 我们的界面文件（在**本仓库**里）与它要放到的位置（上游源码树里）。
  # 界面定义的 Id，注入到上游 wxs 的是 <UIRef Id="..." />。
  # 注入锚点，命中数必须**恰好 1**，否则构建失败（说明上游改了这几处，需要人工跟进）。
  # 1) 上游 wxs：v0.7.0 起自带英文向导，把 <ui:WixUI Id="WixUI_InstallDir"...> 整行替换为 UIRef。
  # 2) 上游 wxs 的 INSTALLFOLDER Property（含 RegistrySearch 记住上次路径）：补上 Secure="yes"。
  # 3) 上游 package.ps1：在 `wix build (... 'photocraft.wxs')` 之后补上我们的界面文件。

concurrency:
  group: zh-hans-windows
  cancel-in-progress: false

jobs:
  resolve:
    name: 确定构建目标
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.r.outputs.ref }}
      sha: ${{ steps.r.outputs.sha }}
      short_sha: ${{ steps.r.outputs.short_sha }}
      version_suffix: ${{ steps.r.outputs.version_suffix }}
      release_tag: ${{ steps.r.outputs.release_tag }}
      should_build: ${{ steps.r.outputs.should_build }}
      make_release: ${{ steps.r.outputs.make_release }}
      reason: ${{ steps.r.outputs.reason }}
    steps:
      - name: 解析分支 / 版本并校验中文词条
        id: r
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_REF: ${{ inputs.upstream_ref }}
          INPUT_SUFFIX: ${{ inputs.version_suffix }}
          INPUT_RELEASE: ${{ inputs.make_release }}
        run: |
          set -uo pipefail

          skip() {
            echo "$1"
            {
              echo "should_build=false"
              echo "reason=$1"
              echo "ref=${ref:-}"
              echo "sha=${sha:-}"
              echo "short_sha=${short:-}"
              echo "version_suffix=${suffix:-zh.1}"
              echo "release_tag="
              echo "make_release=false"
            } >> "$GITHUB_OUTPUT"
            exit 0
          }

          ref=""; sha=""; short=""

          if [ -n "${INPUT_REF:-}" ]; then
            # ---- 手动触发 ----
            ref="$INPUT_REF"
            suffix="${INPUT_SUFFIX:-zh.1}"
            make_release="${INPUT_RELEASE:-true}"
            reason="手动构建 ref=$ref"
          else
            # ---- 定时触发：跟随上游最新 Release ----
            ref="$(gh api "repos/$UPSTREAM/releases/latest" --jq .tag_name 2>/dev/null || true)"
            suffix="zh.1"
            make_release="true"
            if [ -z "$ref" ]; then
              skip "上游还没有 Release，跳过"
            fi
            reason="定时跟版：上游最新 Release $ref"
          fi

          sha="$(gh api "repos/$UPSTREAM/commits/$ref" --jq .sha 2>/dev/null || true)"
          if [ -z "$sha" ]; then
            skip "找不到上游 ref '$ref'"
          fi
          short="${sha:0:7}"

          # 关键校验①：这个 ref 到底有没有简体中文词条（防止产出「英文界面的中文版」）
          if ! gh api "repos/$UPSTREAM/contents/$ZH_CATALOG?ref=$ref" >/dev/null 2>&1; then
            echo "::notice::上游 ref '$ref' 不含 $ZH_CATALOG，构建出来仍是英文界面，已跳过。"
            echo "::notice::上游的早期版本（如 v0.2.0）属于这种情况；请改用 main 分支，或等上游发版。"
            skip "ref '$ref' 不含简体中文词条，跳过构建"
          fi

          # Release 标签：定时跟版按上游 tag 去重；手动构建带上 commit 短哈希
          safe_ref="$(printf '%s' "$ref" | tr '/' '-')"
          if [ -n "${INPUT_REF:-}" ]; then
            release_tag="zh-hans-${safe_ref}-${short}"
          else
            release_tag="zh-hans-${safe_ref}"
          fi

          {
            echo "should_build=true"
            echo "reason=$reason"
            echo "ref=$ref"
            echo "sha=$sha"
            echo "short_sha=$short"
            echo "version_suffix=$suffix"
            echo "release_tag=$release_tag"
            echo "make_release=$make_release"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### 中文版构建目标"
            echo ""
            echo "- 上游 ref：\`$ref\`"
            echo "- commit：\`$sha\`"
            echo "- 版本后缀：\`$suffix\`"
            echo "- Release 标签：\`$release_tag\`"
          } >> "$GITHUB_STEP_SUMMARY"

  keepalive:
    name: 保活（防止定时构建被 GitHub 停用）
    # 公开仓库连续 60 天没有任何提交时，GitHub 会「悄悄」停用定时任务，不通知。
    # 而这个仓库平时不会产生提交（编译用的代码是从上游现拉的），正好会踩中这条规则。
    # 所以定时任务每次运行时顺便看一眼：距上次提交超过 50 天就补一个空提交，把计时清零。
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 距上次提交超过 50 天则补一个空提交
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          last="$(gh api "repos/${{ github.repository }}/commits?per_page=1" --jq '.[0].commit.committer.date' 2>/dev/null || true)"
          if [ -z "$last" ]; then
            echo "::warning::读不到最近提交时间，跳过保活"
            exit 0
          fi
          days=$(( ( $(date -u +%s) - $(date -u -d "$last" +%s) ) / 86400 ))
          echo "最近一次提交在 $days 天前（$last）"
          if [ "$days" -lt 50 ]; then
            echo "还不需要保活"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "保活：重置定时任务计时（超过 50 天没有提交）"
          git push
          echo "::notice::已补一个空提交，定时任务计时已重置"

  build:
    name: 构建 Windows x64 中文安装包
    needs: resolve
    if: needs.resolve.outputs.should_build == 'true'
    runs-on: windows-latest
    env:
      REF: ${{ needs.resolve.outputs.ref }}
      SHA: ${{ needs.resolve.outputs.sha }}
      SUFFIX: ${{ needs.resolve.outputs.version_suffix }}
      TAG: ${{ needs.resolve.outputs.release_tag }}
      MAKE_RELEASE: ${{ needs.resolve.outputs.make_release }}
    steps:
      - name: 说明
        shell: bash
        run: |
          echo "上游：$UPSTREAM @ $REF（$SHA）"
          echo "原因：${{ needs.resolve.outputs.reason }}"

      # 上游源码
      - name: 拉取上游源码
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM }}
          ref: ${{ env.REF }}
          path: src
          fetch-depth: 1

      # 本仓库：只为取 overrides/photocraft.zh-hans.wxl（中文安装向导文案）
      - name: 拉取本仓库（只为取安装界面覆盖文件）
        uses: actions/checkout@v4
        with:
          path: builder
          fetch-depth: 1

      # 与官方发版一致的内嵌字体集合。缺了它构建也能过（上游支持无字体构建），
      # 但交付物会和官方不一致，所以这里连同 CRAFT_FONTS_REQUIRED=1 一起设上：
      # 字体目录拿不到就直接失败，而不是静默产出一个少了字体的包。
      - name: 拉取 craft-fonts（与官方发版一致的字形集合）
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CRAFT_FONTS_REPO }}
          ref: ${{ env.CRAFT_FONTS_REF }}
          path: craft-fonts

      # 把我们的安装界面接上去：两处极小注入 + 复制界面文件本身。
      # 每处都先校验锚点存在且唯一，并在注入后复查，任何一步不符就红着失败，
      # 不会静默产出一个「不能自选安装路径」的包。
      # 简体中文版：安装向导文案覆盖（上游 v0.17.0 起自带完整向导 + 作用域选择页，
      # 我们不再自建 installer-ui.wxs —— 那套覆盖每逢上游改安装界面就会失效，10-29 就是如此）。
      # 这里只做一件事：把 wix build 的 -loc 指向我们的中文文案文件，不碰上游的界面结构。
      - name: 应用中文安装向导文案
        shell: bash
        run: |
          set -euo pipefail
          ps1="src/packaging/windows/package.ps1"
          src_wxl="builder/overrides/photocraft.zh-cn.wxl"
          dest_wxl="src/packaging/windows/photocraft.zh-cn.wxl"

          test -f "$ps1" || { echo "::error::上游没有 $ps1（目录结构可能变了）"; exit 1; }
          test -f "$src_wxl" || { echo "::error::本仓库缺少 $src_wxl"; exit 1; }

          # 锚点校验用 grep -F 固定串。注意 $PSScriptRoot 是 PowerShell 的变量，
          # 在 bash 双引号里必须写成 \$PSScriptRoot，否则 set -u 会报 unbound variable。
          n="$(grep -c -F -- "-culture en-US -loc (Join-Path \$PSScriptRoot 'photocraft.en-us.wxl')" "$ps1" || true)"
          echo "package.ps1 的 -culture/-loc 锚点命中 $n 次（应为 1）"
          if [ "$n" -ne 1 ]; then
            echo "::error::上游 $ps1 的 wix build 调用变了，锚点命中 $n 次。上游可能换了向导文案文件，需要人工确认后再更新这里。"
            exit 1
          fi

          cp "$src_wxl" "$dest_wxl"
          # 把「-culture en-US -loc ...en-us.wxl」整段换成「-culture zh-cn -loc ...zh-cn.wxl」。
          # 用固定串替换文件名 + 单独改 culture，避免正则里的括号与 $ 被当作特殊符号。
          sed -e "s|-culture en-US|-culture zh-cn|" -e "s|'photocraft.en-us.wxl'|'photocraft.zh-cn.wxl'|" "$ps1" > "$ps1.new"
          mv "$ps1.new" "$ps1"
          grep -q -F -- "-culture zh-cn -loc (Join-Path \$PSScriptRoot 'photocraft.zh-cn.wxl')" "$ps1" \
            || { echo "::error::package.ps1 的 -culture/-loc 替换失败"; exit 1; }
          echo "  ✅ 安装向导文案已切到中文："
          grep -n -A2 'wix build' "$ps1" | sed 's/^/      /'

      - name: 安装 Rust (stable, x86_64-pc-windows-msvc)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: 缓存 cargo 产物（大幅缩短重复构建时间）
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src
          key: zh-hans-windows-x64

      # 关键校验②：真正检出的源码里必须有简体中文词条，且内容看起来是真中文。
      - name: 校验中文词条确实存在
        shell: bash
        run: |
          set -euo pipefail
          cat_file="src/$ZH_CATALOG"
          test -s "$cat_file" || { echo "::error::找不到中文词条文件 $cat_file"; exit 1; }
          lines="$(grep -c '' "$cat_file")"
          # 注意：用 [^ -~] 而不是 grep -P，因为 Git Bash 自带的 grep 不一定编译了 PCRE 支持。
          # 在 C 区域下它匹配任何非可打印 ASCII 字节，用来统计「含中文的行数」足够了。
          nonascii="$(LC_ALL=C grep -c '[^ -~]' "$cat_file" || true)"
          echo "词条文件：$cat_file —— $lines 行，其中含非 ASCII（中文）的行 $nonascii 行"
          if [ "$nonascii" -lt 100 ]; then
            echo "::error::词条里的中文内容太少（仅 $nonascii 行），疑似异常，已中止。"
            exit 1
          fi

      - name: 安装 WiX 5（用于生成 MSI）
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          # 上游 package.ps1 的 wix build 需要 UI/Util 扩展（v0.6+ 开始），不装会报 WIX0144
          wix extension add -g WixToolset.UI.wixext/5.0.2 WixToolset.Util.wixext/5.0.2

      - name: 生成带后缀的版本号
        id: v
        shell: bash
        run: |
          set -euo pipefail
          base="$(grep -A5 '^\[workspace.package\]' src/Cargo.toml | grep -m1 '^version' | sed 's/.*"\(.*\)".*/\1/')"
          if [ -z "$base" ]; then echo "::error::无法从 Cargo.toml 读取版本号"; exit 1; fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "full=${base}-${SUFFIX}" >> "$GITHUB_OUTPUT"
          echo "基础版本号 $base，完整版本号 ${base}-${SUFFIX}（MSI 产品号取 $base）"

      - name: 编译并打包（调用官方 package.ps1：MSI + 便携版 zip）
        shell: pwsh
        working-directory: src
        env:
          PHOTOCRAFT_VERSION: ${{ steps.v.outputs.full }}
          PHOTOCRAFT_BUILD_SHA: ${{ env.SHA }}
          # 内嵌字体（与官方一致）。工作区根目录下的 craft-fonts 是上面刚检出的。
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: '1'
          # 不设置签名密钥 → 上游 sign.ps1 会打印警告并以 exit 0 跳过（不打签名）
        run: ./packaging/windows/package.ps1 -Arch x64

      # 关键校验③：产出 MSI 里确实带上了「自选安装位置」界面，且内嵌字体与官方一致。
      # 原理：对话框名与属性名是 MSI 表里的真实值，会以字符串留在文件中，可直接字节查找。
      # 注意：**不要**拿 <UI Id="..."> 那个标识符来查 —— 它是 WiX 的编译期符号，解析后
      # 并不会作为字符串留在 MSI 里（第一版就是这么误判，把一个好包卡住了）。
      # 下面这几个字符串都在本机用同版本 WiX 的编译产物实测过可以按字节查到。
      - name: 校验 MSI 带上了安装目录页与中文向导文案
        shell: bash
        run: |
          set -euo pipefail
          msi="$(find src/dist/release -name '*.msi' -type f | head -1)"
          test -n "$msi" || { echo "::error::找不到产出 MSI"; exit 1; }
          echo "检查 $msi（$(du -h "$msi" | cut -f1)）"
          fail=0
          # 上游 v0.17.0 起自带 WixUI_InstallDir 原生目录页，这里校验它确实在包里；
          # 再校验中文向导文案也编进去了（向导页面标题等字符串会留在 MSI 里）。
          for s in InstallDirDlg WIXUI_INSTALLDIR DirectoryCombo DirectoryListUp BrowseDlg; do
            if LC_ALL=C grep -a -q -F -e "$s" "$msi"; then
              echo "  ✅ $s"
            else
              echo "  ❌ $s"
              fail=1
            fi
          done
          # 我们的中文文案在 MSI 里按代码页 936（GBK）存储，所以要用 GBK 字节去查，
          # 用 UTF-8 的中文去 grep 是查不到的。
          zh_gbk="$(printf '\xce\xaa\xd5\xe2\xcc\xa8\xb5\xe7\xc4\xd4\xc9\xcf\xb5\xc4\xcb\xf9\xd3\xd0\xd3\xc3\xbb\xa7\xb0\xb2\xd7\xb0')"
          if LC_ALL=C grep -a -q -F -e "$zh_gbk" "$msi"; then
            echo "  ✅ 中文向导文案已编入 MSI（GBK 字节命中）"
          else
            echo "  ❌ 中文向导文案未编入 MSI"
            fail=1
          fi

          if [ "$fail" -ne 0 ]; then
            echo "::error::MSI 里没有安装目录页或中文向导文案 —— 文案覆盖没生效，已中止发布。"
            exit 1
          fi

          # 顺带确认内嵌字体确实被带上（即 CRAFT_FONTS_DIR 生效、与官方一致）。
          # 判据：便携版里随附的字体许可文件 —— 上游 package.ps1 会为 craft-fonts 下的
          # 每个字体目录复制一份 OFL-<目录>.txt。
          zp="$(find src/dist/release -name '*.zip' -type f | head -1)"
          if [ -n "$zp" ]; then
            n="$(LC_ALL=C grep -a -o -E 'OFL-[a-z0-9-]+\.txt' "$zp" | sort -u | grep -c . || true)"
            echo "  便携版里的字体许可文件种类：$n"
            if [ "$n" -lt 3 ]; then
              echo "::error::便携版里没有字体许可文件，说明 CRAFT_FONTS_DIR 没生效，包会和官方不一致。"
              exit 1
            fi
          fi

      # 关键校验④：产出 exe 里确实含简体中文译文。
      # 上游 v0.7.0 起 build.rs 把 src/i18n/*.tsv 用 flate2 压成 OUT_DIR/i18n/<lang>.tsv.deflate，
      # catalog! 宏再 include_bytes! 编进 exe，运行时才 inflate；v0.9.0 起改为**去重打包**：
      # 各语言重复的英文原文抽成 keys.deflate，每语言只存差异（条目行写成 \x01<译文> 或
      # \x02<偏移><TAB><译文>，非条目行以 \x03 前缀转义），运行时 unpack 还原。
      # 所以 exe 里**不再有明文中文字符串**，且 zh-hans.tsv.deflate 解压后也不再等于词条文件，
      # 旧版逐字节比对必然误报（好包也会被卡住）。新校验分三层证明：
      #   1) OUT_DIR 确实生成了 zh-hans.tsv.deflate 与 keys.deflate（build.rs 覆盖到中文词条）；
      #   2) 按上游 unpack 算法（keys.deflate + 每语言差异 deflate）还原词条，与本次检出的
      #      zh-hans.tsv 逐字节一致（编的是这份词条、内容为真中文）；
      #   3) 取 deflate 数据的中段 32 字节在 exe 里按字节命中（include_bytes! 真把它编进了二进制）。
      - name: 校验 exe 内确实含简体中文译文
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $rel = 'src/target/x86_64-pc-windows-msvc/release'
          $exePath = Join-Path $rel 'photocraft.exe'
          if (-not (Test-Path $exePath)) { throw "找不到编译出的 photocraft.exe：$exePath" }
          $exe = Get-Item $exePath
          Write-Host "检查 $($exe.FullName)（$([math]::Round($exe.Length/1MB,1)) MB）是否含简体中文译文"

          # 1) OUT_DIR 的 deflate 产物
          $def = Get-ChildItem -Path (Join-Path $rel 'build') -Recurse -Filter 'zh-hans.tsv.deflate' -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $def) { throw "找不到 OUT_DIR 的 i18n/zh-hans.tsv.deflate —— build.rs 未生成中文词条压缩产物" }
          $defBytes = [IO.File]::ReadAllBytes($def.FullName)
          if ($defBytes.Length -lt 16) { throw "deflate 产物异常过小：$($defBytes.Length) 字节" }
          Write-Host "  ✅ 找到 deflate 产物：$($def.Name)（$($defBytes.Length) 字节）"

          # 2) 上游 v0.9.0 起打包格式是「keys.deflate + 每语言差异 deflate」：条目行不再重复
          #    英文原文，而是 \x01<译文>（键紧跟 keys 上一条）或 \x02<偏移><TAB><译文>
          #    （跳回 keys 中的索引），非条目行以 \x03 前缀转义。这里解压 keys.deflate 与
          #    zh-hans.tsv.deflate，按上游 unpack() 算法还原词条，再与检出的 zh-hans.tsv
          #    逐字节比对（证明编进 exe 的是这份词条、内容为真中文）。
          $srcBytes = [IO.File]::ReadAllBytes((Join-Path 'src' $env:ZH_CATALOG))
          function Invoke-Inflate([byte[]]$src) {
            if ($src.Length -eq 0) { return (New-Object byte[] 0) }
            $ms = New-Object IO.MemoryStream(,$src)
            $ds = New-Object IO.Compression.DeflateStream($ms, [IO.Compression.CompressionMode]::Decompress)
            $outMs = New-Object IO.MemoryStream
            $ds.CopyTo($outMs); $ds.Dispose(); $ms.Dispose()
            $bytes = $outMs.ToArray(); $outMs.Dispose()
            return ,$bytes
          }
          $defKeys = Get-ChildItem -Path (Join-Path $rel 'build') -Recurse -Filter 'keys.deflate' -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $defKeys) { throw "找不到 OUT_DIR 的 i18n/keys.deflate —— build.rs 未生成去重键表" }
          $keysBytes = [IO.File]::ReadAllBytes($defKeys.FullName)
          $keysText = [Text.Encoding]::UTF8.GetString([byte[]](Invoke-Inflate $keysBytes))
          $keys = $keysText.Split([char]10)   # 保留空元素，与上游 split('\n') 语义一致
          if ($keys.Length -gt 0 -and $keys[$keys.Length-1] -eq '') { $keys = $keys[0..($keys.Length-2)] }
          $packedText = [Text.Encoding]::UTF8.GetString([byte[]](Invoke-Inflate $defBytes))
          Write-Host "  调试: def=$(Split-Path $def.FullName -Leaf) dir=$(Split-Path (Split-Path $def.FullName)) $($defBytes.Length)B"
          Write-Host "  调试: keys=$(Split-Path $defKeys.FullName -Leaf) dir=$(Split-Path (Split-Path $defKeys.FullName)) $($keysBytes.Length)B keys=$($keys.Length)"
          Write-Host "  调试: packedText=$($packedText.Length) 字符"
          $P1 = [string][char]1; $P2 = [string][char]2; $P3 = [string][char]3
          $sb = New-Object Text.StringBuilder
          $next = 0
          $packedLines = $packedText.Split([char]10)   # 保留空元素，与上游 split('\n') 语义一致
          for ($n = 0; $n -lt $packedLines.Length; $n++) {
            if ($n -gt 0) { [void]$sb.Append("`n") }
            $line = $packedLines[$n]
            # 空行（Windows 检出为 CRLF 时是单个 \r）不是词条：上游 build.rs 原样保留，这里也
            # 原样追加（下面的逐字节比对依赖它），只是不参与词条判定。
            if ($line.Length -eq 0 -or [int][char]$line[0] -eq 13) {
              [void]$sb.Append($line)
              continue
            }
            # 前缀判断一律用 Ordinal：pwsh(.NET/ICU) 的 culture-sensitive 比较把 \r、\x01 这类
            # 控制字符视为可忽略，会把空行误判成 \x01 开头的空译文条目。
            if ($line.StartsWith($P1, [StringComparison]::Ordinal)) {
              if ($line.Length -lt 2) { throw "packed line $($n+1): 空译文条目（$([BitConverter]::ToString([Text.Encoding]::UTF8.GetBytes($line)))）" }
              $index = $next; $tr = $line.Substring(1)
            } elseif ($line.StartsWith($P2, [StringComparison]::Ordinal)) {
              $rest = $line.Substring(1)
              $tab = $rest.IndexOf("`t")
              if ($tab -lt 0) { throw "packed line $($n+1): bad key reference" }
              $offset = [int64]::Parse($rest.Substring(0, $tab))
              $index = $next + $offset
              $tr = $rest.Substring($tab + 1)
            } else {
              if ($line.StartsWith($P3, [StringComparison]::Ordinal)) { $line = $line.Substring(1) }
              [void]$sb.Append($line)
              continue
            }
            if ($index -lt 0 -or $index -ge $keys.Length) { throw "packed line $($n+1): bad key reference" }
            [void]$sb.Append($keys[$index]); [void]$sb.Append("`t"); [void]$sb.Append($tr)
            $next = $index + 1
          }
          $rebuiltBytes = [Text.Encoding]::UTF8.GetBytes($sb.ToString())
          if ($rebuiltBytes.Length -ne $srcBytes.Length) { throw "还原词条长度 $($rebuiltBytes.Length) 与检出词条 $($srcBytes.Length) 不一致" }
          $bad = -1
          for ($i = 0; $i -lt $srcBytes.Length; $i++) { if ($rebuiltBytes[$i] -ne $srcBytes[$i]) { $bad = $i; break } }
          if ($bad -ge 0) { throw "还原词条与检出词条不一致（偏移 $bad）" }
          Write-Host "  ✅ 还原后与检出词条逐字节一致（$($srcBytes.Length) 字节，含简体中文）"

          # 3) deflate 数据窗口在 exe 中按字节命中
          $winLen = 32
          $start = [Math]::Max(0, [int]($defBytes.Length / 2) - [int]($winLen / 2))
          $win = New-Object byte[] $winLen
          [Array]::Copy($defBytes, $start, $win, 0, $winLen)
          $exeBytes = [IO.File]::ReadAllBytes($exePath)
          $found = $false
          for ($i = 0; $i -le $exeBytes.Length - $winLen; $i++) {
            $ok = $true
            for ($j = 0; $j -lt $winLen; $j++) { if ($exeBytes[$i + $j] -ne $win[$j]) { $ok = $false; break } }
            if ($ok) { $found = $true; break }
          }
          if (-not $found) { throw "exe 中找不到 deflate 数据窗口 —— zh-hans 词条未被 include_bytes! 编入二进制" }
          Write-Host "  ✅ exe 中命中 deflate 数据（偏移 $i）"
          Write-Host "✅ 简体中文译文已以压缩形式编入 exe"

      # 合规：把许可证与声明随分发一起给出。
      # 上游 package.ps1 会把仓库根目录的 README.md / LICENSE / LICENSE-MIT / LICENSE-APACHE
      # 复制进便携版 zip，但**不含 NOTICE**；而 NOTICE 里既有版权与商标声明，也有第三方组件清单
      # （Apache-2.0 第 4(d) 条要求随分发提供其内容）。这里把整套文件单独放成 Release 附件，
      # 并额外生成一份「本构建改了什么」的说明，让「非官方构建」这一点在包外也能看到。
      - name: 生成许可证与改动声明
        shell: bash
        working-directory: src
        env:
          SHA: ${{ env.SHA }}
          REF: ${{ env.REF }}
        run: |
          set -euo pipefail
          dir="dist/release/licenses"
          rm -rf "$dir"; mkdir -p "$dir"

          for f in LICENSE LICENSE-MIT LICENSE-APACHE NOTICE; do
            [ -f "$f" ] || continue
            case "$f" in
              LICENSE)        cp "$f" "$dir/LICENSE.txt" ;;
              LICENSE-MIT)    cp "$f" "$dir/LICENSE-MIT.txt" ;;
              LICENSE-APACHE) cp "$f" "$dir/LICENSE-APACHE.txt" ;;
              NOTICE)         cp "$f" "$dir/NOTICE.txt" ;;
            esac
            echo "  随附 $f"
          done
          test -s "$dir/LICENSE-MIT.txt" || { echo "::error::找不到上游 LICENSE-MIT —— 再分发必须随附许可证"; exit 1; }
          [ -s "$dir/NOTICE.txt" ] || echo "::warning::上游仓库没有 NOTICE 文件"

          cat > "$dir/UNOFFICIAL-BUILD-zh-CN.txt" <<NOTICE_EOF
          这是基于 PhotoCraft 的【非官方】简体中文构建，不是官方发布。

          程序主体为原作者（PhotoCraft contributors）的作品，采用 Apache-2.0 许可
          （全文见同目录 LICENSE-APACHE.txt / LICENSE-MIT.txt，版权、商标与第三方组件声明见 NOTICE.txt）。

          本构建只修改了构建配置与安装界面，未修改程序源码：
            1) 安装界面新增「选择安装位置」：欢迎页可直接改路径或点 Browse... 浏览。
            2) 界面中文字体沿用系统字体（Windows 上为微软雅黑），与官方包一致；
               随包内嵌的 craft-fonts 字形集合也与官方发版保持一致。

          源码：storytold/photocraft @ ${REF:-unknown} (${SHA:-unknown})
          构建时间：$(date -u +%Y-%m-%dT%H:%M:%SZ)
          由第三方自动构建，与原项目作者无隶属、赞助或背书关系。本构建未做代码签名。

          ----------------------------------------------------------------------

          This is an UNOFFICIAL Simplified-Chinese build of PhotoCraft. It is NOT an official release.

          The application is the work of the PhotoCraft contributors, licensed under Apache-2.0
          (see LICENSE-APACHE.txt / LICENSE-MIT.txt; copyright, trademark and third-party
          notices in NOTICE.txt).

          Only build configuration and the installer UI were changed; no program source was modified:
            1) The installer gained a "choose install location" page.
            2) The Simplified-Chinese UI font remains the system font (Microsoft YaHei on Windows),
               and the embedded craft-fonts set matches the official release.

          Source: storytold/photocraft @ ${REF:-unknown} (${SHA:-unknown})
          Built:  $(date -u +%Y-%m-%dT%H:%M:%SZ)
          Third-party automated build; not affiliated with or endorsed by the original authors.
          Not code-signed.
          NOTICE_EOF

          test -s "$dir/UNOFFICIAL-BUILD-zh-CN.txt" || { echo "::error::改动声明生成失败（文件为空）"; exit 1; }
          ls -la "$dir"
          echo "✅ 许可证与改动声明已生成"

      - name: 列出产物
        shell: bash
        run: ls -la src/dist/release/ src/dist/release/licenses/ | sed 's/^/  /'

      - name: 上传为 Actions 产物
        uses: actions/upload-artifact@v4
        with:
          name: photocraft-zh-hans-${{ needs.resolve.outputs.short_sha }}-windows-x64
          path: |
            src/dist/release/*.msi
            src/dist/release/*.zip
            src/dist/release/licenses/*
          if-no-files-found: error

      - name: 创建 / 更新 Release
        if: env.MAKE_RELEASE == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # 关键：运行目录不是 git 仓库（源码是从上游拉的），不显式指定仓库，
          # gh release 会报 "fatal: not a git repository"。
          GH_REPO: ${{ github.repository }}
          BASE_VERSION: ${{ steps.v.outputs.base }}
          FULL_VERSION: ${{ steps.v.outputs.full }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/release-notes.md"

          cat > "$notes" <<EOF
          PhotoCraft 简体中文版（Windows x64）

          > ⚠️ **非官方构建（unofficial build）** —— 本安装包由第三方自动构建，**不是官方发布**，
          > 与原项目作者不存在隶属、赞助或背书关系。程序主体为原作者（PhotoCraft contributors）
          > 的作品，采用 Apache-2.0 许可；本构建**只修改了构建配置与安装界面，未修改程序源码**。
          > 具体改动见本 Release 附带的 UNOFFICIAL-BUILD-zh-CN.txt。

          由上游源码自动编译。界面译文已编译进二进制，无需任何额外语言包。

          - 源码来源：\`$UPSTREAM @ $REF\`
          - commit：\`$SHA\`
          - 完整版本号：\`$FULL_VERSION\`（后缀只出现在文件名里）
          - 界面中文字体：\`系统字体（Windows 上为微软雅黑）\` —— 中文不需要嵌入字体
          - 内嵌字体：与官方发版相同的 \`craft-fonts\` 字形集合（日文字体）；除安装界面外，本包与官方一致
          - 安装时可自选安装位置：安装向导的「选择安装位置」页可直接改路径，或点「浏览」选目录（默认在 \`C:\Program Files\ArtCraft\PhotoCraft\`；选「仅为我安装」时默认在自己的用户目录）
          - 未做代码签名：首次运行 Windows 可能提示「未知发布者」，点「更多信息 → 仍要运行」即可
          - 与官方同版本装过也没关系：MSI 的 \`AllowSameVersionUpgrades\` 会直接替换旧版

          ## 安装后如何切换到中文

          一般无需操作：应用会自动跟随系统语言（Windows 用户区域为中文时即为中文界面）。
          如仍是英文，可在设置里把界面语言改为「简体中文」。

          ## 许可证、署名与改动声明

          PhotoCraft 采用 Apache-2.0 许可（仓库内同时提供 MIT 许可文本）。本 Release 附带以下文件，
          可单独下载：

          | 文件 | 内容 |
          |---|---|
          | LICENSE-APACHE.txt、LICENSE-MIT.txt | 上游许可证全文 |
          | NOTICE.txt | 上游版权、商标与第三方组件许可声明 |
          | UNOFFICIAL-BUILD-zh-CN.txt | 本构建的改动说明（非官方声明）|

          便携版 zip 内同时含 LICENSE-MIT、LICENSE-APACHE、README.md 及内嵌字体的许可文件。

          界面中文字体使用系统字体（Windows 上为微软雅黑），因此本包不分发中文字体。

          本构建为非官方第三方构建，与原项目作者无隶属、赞助或背书关系；
          名称 PhotoCraft 仅用于说明本软件来源。
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，覆盖其中的产物并刷新说明。"
            gh release upload "$TAG" \
              src/dist/release/*.msi src/dist/release/*.zip src/dist/release/licenses/* --clobber
            gh release edit "$TAG" --notes-file "$notes"
          else
            gh release create "$TAG" \
              --title "PhotoCraft 简体中文版 ${FULL_VERSION} (${SHA:0:7}) · 非官方构建" \
              --notes-file "$notes" \
              --latest \
              src/dist/release/*.msi src/dist/release/*.zip src/dist/release/licenses/*
          fi
